<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <title>Keep</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" type="button" title="Main menu" aria-label="Main menu"></button>
    <a href="#/" class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>Keep</span></a>
    <div class="searchbox" role="search">
      <span id="search-icon" class="search-icon"></span>
      <input id="search" type="search" placeholder="Search" aria-label="Search notes" autocomplete="off">
      <button id="search-clear" class="icon-btn" type="button" title="Clear search" aria-label="Clear search"></button>
    </div>
    <div class="top-actions">
      <button id="sync-btn" class="icon-btn" type="button"></button>
      <button id="layout-btn" class="icon-btn" type="button"></button>
      <a id="settings-btn" class="icon-btn" href="#/settings" title="Settings" aria-label="Settings"></a>
    </div>
  </header>

  <nav id="nav" aria-label="Main"></nav>
  <div id="scrim"></div>

  <main id="view" tabindex="-1"></main>

  <dialog id="editor" aria-label="Note"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/js-yaml.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
